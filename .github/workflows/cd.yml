name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate using static AWS credentials, not OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/linked-frontend:$IMAGE_TAG" \
            -t "$REGISTRY/linked-frontend:latest" \
            ./frontend

          docker push "$REGISTRY/linked-frontend:$IMAGE_TAG"
          docker push "$REGISTRY/linked-frontend:latest"

      - name: Build and push backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/linked-backend:$IMAGE_TAG" \
            -t "$REGISTRY/linked-backend:latest" \
            ./backend

          docker push "$REGISTRY/linked-backend:$IMAGE_TAG"
          docker push "$REGISTRY/linked-backend:latest"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY
          script: |
            set -eu

            cd /home/ec2-user/linked

            export IMAGE_TAG="$IMAGE_TAG"
            export REGISTRY="$REGISTRY"

            aws ecr get-login-password \
              --region us-east-1 | \
              docker login \
                --username AWS \
                --password-stdin "$REGISTRY"

            docker compose config --quiet
            docker compose pull
            docker compose up -d --remove-orphans

            docker compose ps
