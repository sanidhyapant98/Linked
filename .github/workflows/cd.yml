name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate using static AWS credentials, not OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/linked-frontend:$IMAGE_TAG" \
            -t "$REGISTRY/linked-frontend:latest" \
            ./frontend

          docker push "$REGISTRY/linked-frontend:$IMAGE_TAG"
          docker push "$REGISTRY/linked-frontend:latest"

      - name: Build and push backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/linked-backend:$IMAGE_TAG" \
            -t "$REGISTRY/linked-backend:latest" \
            ./backend

          docker push "$REGISTRY/linked-backend:$IMAGE_TAG"
          docker push "$REGISTRY/linked-backend:latest"

      - name: Deploy on EC2
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          SCRIPT=$(cat <<EOF
          set -euo pipefail

          cd /home/ec2-user/linked

          export IMAGE_TAG="${IMAGE_TAG}"

          aws ecr get-login-password \
            --region us-east-1 | \
            docker login \
              --username AWS \
              --password-stdin "${REGISTRY}"

          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker compose -f docker-compose.prod.yml ps
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Linked ${IMAGE_TAG}" \
            --parameters "$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "$INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "Status: $STATUS"

          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --query '{stdout: StandardOutputContent, stderr: StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
