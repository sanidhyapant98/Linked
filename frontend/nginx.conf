# Same-origin API strategy for Docker / Kubernetes:
# The SPA is built with VITE_API_BASE_URL="" so the browser calls
# relative URLs (/api/..., /health, /<shortCode>). nginx proxies those
# to the backend Service (Compose service `backend`, K8s Service `backend:3000`).
# Browser -> Ingress/NodePort -> frontend:80 -> backend:3000.
# Local `vite dev` still uses VITE_API_BASE_URL=http://localhost:3000 directly.
# NOTE: backend host `backend` must match the Compose service name and the
# K8s Service name (backend:3000). DNS is resolved per-request via variable
# (not at startup) so nginx starts even if the backend isn't ready yet.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS (127.0.0.11) + kube-dns (10.96.0.10 default).
  # Whichever exists answers; the other is skipped per-request.
  resolver 127.0.0.11 10.96.0.10 valid=30s ipv6=off;
  set $backend_upstream backend:3000;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Frontend's own liveness (K8s livenessProbe, Docker HEALTHCHECK).
  # Backend health stays at /health (proxied below) so api.health()
  # still receives {"status":"ok","database":"connected"}.
  location = /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # --- Backend API (proxied, same-origin) ---
  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /health {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /openapi.json {
    proxy_pass http://$backend_upstream;
  }

  location /api-docs/ {
    proxy_pass http://$backend_upstream;
  }
  location = /api-docs {
    return 301 /api-docs/;
  }

  # Short-code redirects: 6-char base64url (see backend generateShortCode).
  # Must come before the SPA fallback so https://<host>/<code> resolves.
  # SPA routes (/ , /links, /links/:id) are multi-char / nested, so no clash.
  location ~ "^/[A-Za-z0-9_-]{6}$" {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
